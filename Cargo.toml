[package]
name = "decker"
version = "0.1.0"
edition = "2021"
description = "A Rust daemon that reads Xbox controller input and translates it into keyboard shortcuts to control Okular"
authors = ["itd22"]

[[bin]]
name = "decker"
path = "src/main.rs"

[dependencies]
gilrs = "0.10"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"

# Input injection
xdotool = "0.3"

# Optional: DBus integration for KDE
zbus = { version = "3", optional = true }

[features]
default = ["xdotool-backend"]
xdotool-backend = []
dbus = ["zbus"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
